<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Calibri, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-family: Cambria, Georgia, 'Times New Roman', serif; font-weight: 700; fill: #FFFFFF; }
      .h { font-weight: 700; fill: #1F2933; }
      .b { fill: #1F2933; }
      .m { fill: #6B7280; }
      .lt { fill: #D9DEE5; }
      .mono { font-family: 'Courier New', Courier, monospace; }
      .red { fill: #C74634; }
      .card { fill: #F4F5F7; }
      .ico { fill: none; stroke: #FFFFFF; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="#1F2933"/>

  <!-- header -->
  <text x="50" y="82" class="title" font-size="40">Shipping AI agents to OCI Enterprise AI</text>
  <text x="50" y="118" class="lt" font-size="19">Six Codex skills: from a prompt to a verified Hosted Application release, then a demo page for its users. One approval for every remote change.</text>
  <text x="1552" y="82" text-anchor="end" fill="#F9A8A0" font-size="17" font-weight="700">Codex Skills for OCI Enterprise AI Deployment</text>

  <!-- ===== pipeline: six cards, 232 wide, 22 apart ===== -->
  <line x1="166" y1="200" x2="1182" y2="200" stroke="#3B4756" stroke-width="3"/>
  <line x1="1182" y1="200" x2="1436" y2="200" stroke="#3B4756" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- card 1: new -->
  <g transform="translate(50 200)">
    <rect x="0" y="0" width="232" height="300" rx="16" class="card"/>
    <circle cx="116" cy="0" r="36" fill="#C74634"/>
    <g class="ico" transform="translate(116 0)">
      <path d="M0 -15 L4 -4 L15 0 L4 4 L0 15 L-4 4 L-15 0 L-4 -4 Z"/>
    </g>
    <text x="16" y="64" class="mono red" font-size="11">1 $oci-agent-new</text>
    <text x="16" y="96" class="h" font-size="21">Create the agent</text>
    <text x="16" y="134" class="b" font-size="13.5">•  from a prompt or a spec</text>
    <text x="16" y="160" class="b" font-size="13.5">•  agent.yaml, Dockerfile, app</text>
    <text x="16" y="186" class="b" font-size="13.5">•  checks .env, no overwrites</text>
    <rect x="16" y="238" width="200" height="36" rx="18" fill="#FFFFFF" stroke="#D9DEE5"/>
    <text x="116" y="261" text-anchor="middle" class="m" font-size="13">Writes local files only</text>
  </g>

  <!-- card 2: build -->
  <g transform="translate(304 200)">
    <rect x="0" y="0" width="232" height="300" rx="16" class="card"/>
    <circle cx="116" cy="0" r="36" fill="#C74634"/>
    <g class="ico" transform="translate(116 0)">
      <path d="M-14 -8 L0 -16 L14 -8 L14 8 L0 16 L-14 8 Z"/>
      <path d="M-14 -8 L0 0 L14 -8 M0 0 L0 16"/>
    </g>
    <text x="16" y="64" class="mono red" font-size="11">2 $oci-agent-build</text>
    <text x="16" y="96" class="h" font-size="21">Build locally</text>
    <text x="16" y="134" class="b" font-size="13.5">•  linux/amd64 with buildx</text>
    <text x="16" y="160" class="b" font-size="13.5">•  read-only run, tmpfs /tmp</text>
    <text x="16" y="186" class="b" font-size="13.5">•  probes, functional checks</text>
    <rect x="16" y="238" width="200" height="36" rx="18" fill="#FFFFFF" stroke="#D9DEE5"/>
    <text x="116" y="261" text-anchor="middle" class="m" font-size="13">Changes local Docker only</text>
  </g>

  <!-- card 3: push -->
  <g transform="translate(558 200)">
    <rect x="0" y="0" width="232" height="300" rx="16" class="card"/>
    <circle cx="116" cy="0" r="36" fill="#C74634"/>
    <g class="ico" transform="translate(116 0)">
      <path d="M-10 10 H-13 A9 9 0 0 1 -12 -8 A13 13 0 0 1 13 -6 A8 8 0 0 1 12 10 H10"/>
      <path d="M0 14 V-2 M-6 4 L0 -2 L6 4"/>
    </g>
    <text x="16" y="64" class="mono red" font-size="11">3 $oci-agent-push</text>
    <text x="16" y="96" class="h" font-size="21">Publish to OCIR</text>
    <text x="16" y="134" class="b" font-size="13.5">•  registry from OCI_REGION</text>
    <text x="16" y="160" class="b" font-size="13.5">•  creates missing repository</text>
    <text x="16" y="186" class="b" font-size="13.5">•  pushes, reports the digest</text>
    <rect x="16" y="238" width="200" height="36" rx="18" fill="#FFFFFF" stroke="#D9DEE5"/>
    <text x="116" y="261" text-anchor="middle" class="m" font-size="13">Each remote write approved</text>
  </g>

  <!-- card 4: deploy -->
  <g transform="translate(812 200)">
    <rect x="0" y="0" width="232" height="300" rx="16" class="card"/>
    <circle cx="116" cy="0" r="36" fill="#C74634"/>
    <g class="ico" transform="translate(116 0)">
      <path d="M-11 12 A10 10 0 0 1 -12 -8 A13 13 0 0 1 13 -6 A9 9 0 0 1 12 12 Z"/>
    </g>
    <text x="16" y="64" class="mono red" font-size="11">4 $oci-agent-deploy</text>
    <text x="16" y="96" class="h" font-size="21">Plan, then deploy</text>
    <text x="16" y="134" class="b" font-size="13.5">•  read-only plan first</text>
    <text x="16" y="160" class="b" font-size="13.5">•  release, upgrade, rollback</text>
    <text x="16" y="186" class="b" font-size="13.5">•  waits for ACTIVE or FAILED</text>
    <rect x="16" y="238" width="200" height="36" rx="18" fill="#FFFFFF" stroke="#D9DEE5"/>
    <text x="116" y="261" text-anchor="middle" class="m" font-size="13">OCI changes only with --apply</text>
  </g>

  <!-- card 5: verify -->
  <g transform="translate(1066 200)">
    <rect x="0" y="0" width="232" height="300" rx="16" class="card"/>
    <circle cx="116" cy="0" r="36" fill="#C74634"/>
    <g class="ico" transform="translate(116 0)">
      <path d="M15 -3 A15 15 0 1 1 6 -13"/>
      <path d="M-6 0 L0 6 L16 -10"/>
    </g>
    <text x="16" y="64" class="mono red" font-size="11">5 $oci-agent-verify-deployment</text>
    <text x="16" y="96" class="h" font-size="21">Verify the release</text>
    <text x="16" y="134" class="b" font-size="13.5">•  app, deployment ACTIVE</text>
    <text x="16" y="160" class="b" font-size="13.5">•  active tag is the release</text>
    <text x="16" y="186" class="b" font-size="13.5">•  probes, functional checks</text>
    <rect x="16" y="238" width="200" height="36" rx="18" fill="#FFFFFF" stroke="#D9DEE5"/>
    <text x="116" y="261" text-anchor="middle" class="m" font-size="13">Read-only OCI, approved calls</text>
  </g>

  <!-- card 6: ui -->
  <g transform="translate(1320 200)">
    <rect x="0" y="0" width="232" height="300" rx="16" class="card"/>
    <circle cx="116" cy="0" r="36" fill="#C74634"/>
    <g class="ico" transform="translate(116 0)">
      <rect x="-15" y="-12" width="30" height="20" rx="2"/>
      <path d="M0 8 V14 M-8 14 H8"/>
    </g>
    <text x="16" y="64" class="mono red" font-size="11">6 $oci-agent-ui · optional</text>
    <text x="16" y="96" class="h" font-size="21">Show it to users</text>
    <text x="16" y="134" class="b" font-size="13.5">•  local Next.js demo page</text>
    <text x="16" y="160" class="b" font-size="13.5">•  business language, examples</text>
    <text x="16" y="186" class="b" font-size="13.5">•  drafted from the agent spec</text>
    <rect x="16" y="238" width="200" height="36" rx="18" fill="#FFFFFF" stroke="#D9DEE5"/>
    <text x="116" y="261" text-anchor="middle" class="m" font-size="13">Runs on your computer only</text>
  </g>

  <!-- chevrons between cards; the last one is hollow: the UI step is optional -->
  <g fill="#C74634">
    <path d="M286 340 L300 355 L286 370 Z"/>
    <path d="M540 340 L554 355 L540 370 Z"/>
    <path d="M794 340 L808 355 L794 370 Z"/>
    <path d="M1048 340 L1062 355 L1048 370 Z"/>
  </g>
  <path d="M1302 340 L1316 355 L1302 370 Z" fill="none" stroke="#C74634" stroke-width="2"/>

  <!-- ===== lower row ===== -->
  <!-- inputs panel -->
  <g transform="translate(50 550)">
    <rect x="0" y="0" width="600" height="255" rx="16" fill="#2B3646"/>
    <text x="24" y="38" fill="#FFFFFF" font-weight="700" font-size="20">Three inputs, three lifecycles</text>

    <rect x="24" y="60" width="552" height="52" rx="10" fill="#1F2933"/>
    <text x="40" y="92" class="mono" fill="#F9A8A0" font-size="16" font-weight="700">.env</text>
    <text x="150" y="86" class="lt" font-size="14">Tenancy: region, compartment, OCIR namespace and user;</text>
    <text x="150" y="104" class="lt" font-size="14">optional agent secrets (GENAI_API_KEY). Ignored by git.</text>

    <rect x="24" y="120" width="552" height="52" rx="10" fill="#1F2933"/>
    <text x="40" y="152" class="mono" fill="#F9A8A0" font-size="16" font-weight="700">agent.yaml</text>
    <text x="150" y="146" class="lt" font-size="14">Agent: build, publish, deploy, runtime env, functional checks.</text>
    <text x="150" y="164" class="lt" font-size="14">Lives next to the code. Changes with the agent contract.</text>

    <rect x="24" y="180" width="552" height="52" rx="10" fill="#1F2933"/>
    <text x="40" y="212" class="mono" fill="#F9A8A0" font-size="16" font-weight="700">--tag</text>
    <text x="150" y="206" class="lt" font-size="14">Release: one explicit semantic version, never inferred,</text>
    <text x="150" y="224" class="lt" font-size="14">never latest. Changes on every release.</text>
  </g>

  <!-- target panel -->
  <g transform="translate(680 550)">
    <rect x="0" y="0" width="872" height="255" rx="16" class="card"/>
    <text x="24" y="38" class="h" font-size="20">The target: a Hosted Application, its deployment and versions</text>

    <!-- application box -->
    <rect x="24" y="58" width="470" height="176" rx="12" fill="#FFFFFF" stroke="#D9DEE5"/>
    <text x="40" y="84" class="h" font-size="16">Hosted Application</text>
    <text x="478" y="84" text-anchor="end" class="mono red" font-size="14">hello-world</text>
    <text x="40" y="104" class="m" font-size="13">one endpoint · one deployment · up to 20 versions (artifacts)</text>

    <!-- artifact inactive -->
    <rect x="40" y="118" width="210" height="100" rx="10" fill="#F4F5F7" stroke="#D9DEE5"/>
    <text x="54" y="144" class="mono b" font-size="14" font-weight="700">hello-world:0.3.0</text>
    <text x="54" y="166" class="m" font-size="13">kept for rollback</text>
    <rect x="54" y="184" width="82" height="22" rx="11" fill="#D9DEE5"/>
    <text x="95" y="200" text-anchor="middle" class="b" font-size="11" font-weight="700">INACTIVE</text>

    <!-- artifact active -->
    <rect x="268" y="118" width="210" height="100" rx="10" fill="#1F2933"/>
    <text x="282" y="144" class="mono" fill="#FFFFFF" font-size="14" font-weight="700">hello-world:0.4.0</text>
    <text x="282" y="166" class="lt" font-size="13">serving traffic</text>
    <rect x="282" y="184" width="72" height="22" rx="11" fill="#C74634"/>
    <text x="318" y="200" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">ACTIVE</text>

    <!-- container contract -->
    <text x="520" y="84" class="h" font-size="16">What the container must honour</text>
    <g class="b" font-size="14">
      <circle cx="527" cy="108" r="4" fill="#C74634"/><text x="540" y="113">linux/amd64 only</text>
      <circle cx="527" cy="136" r="4" fill="#C74634"/><text x="540" y="141">port 8080 on 0.0.0.0</text>
      <circle cx="527" cy="164" r="4" fill="#C74634"/><text x="540" y="169">GET /health and GET /ready → 200</text>
      <circle cx="527" cy="192" r="4" fill="#C74634"/><text x="540" y="197">read-only filesystem, write only /tmp</text>
      <circle cx="527" cy="220" r="4" fill="#C74634"/><text x="540" y="225">secrets from shell or .env, never in git</text>
    </g>
  </g>

  <!-- footer band -->
  <text x="800" y="858" text-anchor="middle" class="lt" font-size="16">Plan first, apply only with explicit approval  ·  No secrets in agent.yaml, commands or chat  ·  A green local build is not proof that OCI can run the image</text>
</svg>
