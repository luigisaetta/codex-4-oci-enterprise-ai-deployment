[tool.black]
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pylint.main]
py-version = "3.11"

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
# Pydantic models and graph state schemas are declarative data containers.
min-public-methods = 0
